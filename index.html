<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator - Free YouTube Shorts</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function AIVideoGenerator() {
            const [prompt, setPrompt] = useState('');
            const [duration, setDuration] = useState('30');
            const [style, setStyle] = useState('cinematic');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedVideos, setGeneratedVideos] = useState([]);
            const [progress, setProgress] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [showApiInput, setShowApiInput] = useState(false);
            const [error, setError] = useState('');

            const styles = [
                { value: 'cinematic', label: 'Cinematic' },
                { value: 'anime', label: 'Anime' },
                { value: 'realistic', label: 'Realistic' },
                { value: 'abstract', label: 'Abstract' },
                { value: '3d', label: '3D Render' }
            ];

            const promptTemplates = [
                "A breathtaking timelapse of a blooming flower garden",
                "Epic slow motion shot of ocean waves crashing",
                "Futuristic visualization of AI technology",
                "Dramatic close-up of raindrops on glass"
            ];

            // REAL API INTEGRATION - Using Replicate (cheapest option)
            const generateWithReplicate = async () => {
                if (!apiKey) {
                    setError('Please add your Replicate API key first!');
                    setShowApiInput(true);
                    return;
                }

                setIsGenerating(true);
                setProgress(10);
                setError('');

                try {
                    // Start the video generation
                    const response = await fetch('https://api.replicate.com/v1/predictions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Token ${apiKey}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            version: "9f747673945c62801b13b84701c783929c0ee784e4748ec062204894dda1a351", // Zeroscope model
                            input: {
                                prompt: `${style} style: ${prompt}`,
                                num_frames: parseInt(duration) * 8, // 8 fps
                                fps: 8
                            }
                        })
                    });

                    const prediction = await response.json();
                    setProgress(30);

                    // Poll for results
                    let videoUrl = null;
                    let attempts = 0;
                    const maxAttempts = 60; // 5 minutes max

                    while (!videoUrl && attempts < maxAttempts) {
                        await new Promise(resolve => setTimeout(resolve, 5000)); // Wait 5 seconds
                        
                        const statusResponse = await fetch(
                            `https://api.replicate.com/v1/predictions/${prediction.id}`,
                            {
                                headers: {
                                    'Authorization': `Token ${apiKey}`,
                                }
                            }
                        );

                        const status = await statusResponse.json();
                        setProgress(30 + (attempts / maxAttempts) * 60);

                        if (status.status === 'succeeded') {
                            videoUrl = status.output;
                            break;
                        } else if (status.status === 'failed') {
                            throw new Error('Video generation failed');
                        }

                        attempts++;
                    }

                    if (videoUrl) {
                        const newVideo = {
                            id: Date.now(),
                            prompt: prompt,
                            style: style,
                            duration: duration,
                            videoUrl: Array.isArray(videoUrl) ? videoUrl[0] : videoUrl,
                            thumbnail: `https://picsum.photos/seed/${Date.now()}/400/600`,
                            createdAt: new Date().toLocaleString()
                        };
                        
                        setGeneratedVideos([newVideo, ...generatedVideos]);
                        setPrompt('');
                        setProgress(100);
                    } else {
                        throw new Error('Video generation timed out');
                    }

                } catch (err) {
                    setError(`Error: ${err.message}`);
                    console.error(err);
                } finally {
                    setIsGenerating(false);
                    setTimeout(() => setProgress(0), 1000);
                }
            };

            const handleGenerate = async () => {
                if (!prompt.trim()) return;
                await generateWithReplicate();
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-900 via-blue-900 to-black text-white p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-12">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <svg className="w-12 h-12 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                                <h1 className="text-5xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                                    AI Video Studio
                                </h1>
                            </div>
                            <p className="text-gray-300 text-lg">Generate REAL AI videos for YouTube Shorts!</p>
                        </div>

                        {/* API Key Setup */}
                        <div className="bg-yellow-500/10 border border-yellow-400/30 rounded-xl p-6 mb-8">
                            <h3 className="font-bold text-lg mb-2 text-yellow-300 flex items-center gap-2">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                                </svg>
                                Setup Required
                            </h3>
                            <p className="text-sm text-gray-300 mb-3">
                                To generate real videos, you need a Replicate API key (free $5 credit!):
                            </p>
                            <ol className="text-sm text-gray-300 space-y-1 mb-4 ml-4 list-decimal">
                                <li>Go to <a href="https://replicate.com" target="_blank" className="text-purple-400 hover:underline">replicate.com</a></li>
                                <li>Sign up (free)</li>
                                <li>Go to your account → API tokens</li>
                                <li>Copy your token and paste it below</li>
                            </ol>
                            
                            <div className="flex gap-2">
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    placeholder="r8_xxx... (paste your API key here)"
                                    className="flex-1 px-4 py-2 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 text-white placeholder-gray-400 text-sm"
                                />
                                <button
                                    onClick={() => {
                                        if (apiKey) {
                                            alert('API Key saved! You can now generate videos.');
                                            setShowApiInput(false);
                                        }
                                    }}
                                    className="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 rounded-lg text-sm font-medium transition"
                                >
                                    Save Key
                                </button>
                            </div>
                            {apiKey && (
                                <p className="text-green-400 text-sm mt-2">✓ API Key saved! Ready to generate videos.</p>
                            )}
                        </div>

                        {error && (
                            <div className="bg-red-500/10 border border-red-400/30 rounded-xl p-4 mb-6 text-red-300">
                                {error}
                            </div>
                        )}

                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-8 mb-8 border border-white/20">
                            <h2 className="text-2xl font-bold mb-6 flex items-center gap-2">
                                <svg className="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                                </svg>
                                Create Your Video
                            </h2>

                            <div className="mb-6">
                                <label className="block text-sm font-medium mb-2">Video Prompt</label>
                                <textarea
                                    value={prompt}
                                    onChange={(e) => setPrompt(e.target.value)}
                                    placeholder="Describe your video... (e.g., 'A majestic eagle soaring through mountain peaks at sunset')"
                                    className="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-400 h-24 resize-none"
                                />
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-medium mb-2">Quick Templates</label>
                                <div className="flex flex-wrap gap-2">
                                    {promptTemplates.map((template, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setPrompt(template)}
                                            className="px-3 py-1 bg-purple-500/20 hover:bg-purple-500/30 rounded-full text-sm border border-purple-400/30 transition"
                                        >
                                            {template}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                <div>
                                    <label className="block text-sm font-medium mb-2">Style</label>
                                    <select
                                        value={style}
                                        onChange={(e) => setStyle(e.target.value)}
                                        className="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-white"
                                    >
                                        {styles.map(s => (
                                            <option key={s.value} value={s.value} className="bg-gray-900">
                                                {s.label}
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2 flex items-center gap-2">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                        Duration (seconds)
                                    </label>
                                    <select
                                        value={duration}
                                        onChange={(e) => setDuration(e.target.value)}
                                        className="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-white"
                                    >
                                        <option value="3" className="bg-gray-900">3 seconds (test)</option>
                                        <option value="5" className="bg-gray-900">5 seconds</option>
                                        <option value="10" className="bg-gray-900">10 seconds</option>
                                    </select>
                                </div>
                            </div>

                            <button
                                onClick={handleGenerate}
                                disabled={isGenerating || !prompt.trim()}
                                className="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 disabled:from-gray-600 disabled:to-gray-700 rounded-lg font-bold text-lg transition flex items-center justify-center gap-2 disabled:cursor-not-allowed"
                            >
                                {isGenerating ? (
                                    <>
                                        <svg className="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                                        </svg>
                                        Generating Real Video... {Math.round(progress)}%
                                    </>
                                ) : (
                                    <>
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                                        </svg>
                                        Generate REAL Video
                                    </>
                                )}
                            </button>

                            {isGenerating && (
                                <div className="mt-4">
                                    <div className="w-full bg-white/10 rounded-full h-2 overflow-hidden">
                                        <div 
                                            className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-300"
                                            style={{ width: `${progress}%` }}
                                        />
                                    </div>
                                    <p className="text-center text-sm text-gray-400 mt-2">
                                        This takes 2-5 minutes. Don't close this page!
                                    </p>
                                </div>
                            )}
                        </div>

                        {generatedVideos.length > 0 && (
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold mb-6">Your Generated Videos ({generatedVideos.length})</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {generatedVideos.map(video => (
                                        <div key={video.id} className="bg-white/10 backdrop-blur-lg rounded-xl overflow-hidden border border-white/20 hover:border-purple-400/50 transition">
                                            <div className="aspect-video bg-black relative">
                                                <video 
                                                    src={video.videoUrl}
                                                    controls
                                                    className="w-full h-full"
                                                >
                                                    Your browser doesn't support video.
                                                </video>
                                            </div>
                                            <div className="p-4">
                                                <p className="text-sm text-gray-300 mb-2 line-clamp-2">{video.prompt}</p>
                                                <div className="flex items-center justify-between text-xs text-gray-400 mb-3">
                                                    <span>{video.style}</span>
                                                    <span>{video.duration}s</span>
                                                </div>
                                                <a 
                                                    href={video.videoUrl}
                                                    download
                                                    className="w-full py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-sm font-medium flex items-center justify-center gap-2 transition"
                                                >
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                    </svg>
                                                    Download Video
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="bg-blue-500/10 border border-blue-400/30 rounded-xl p-6">
                            <h3 className="font-bold text-lg mb-2 text-blue-300">💰 Cost Breakdown:</h3>
                            <ul className="space-y-2 text-sm text-gray-300">
                                <li>• Replicate gives you $5 FREE credit when you sign up</li>
                                <li>• Each 3-second video costs ~$0.02-0.05</li>
                                <li>• That's 100-250 FREE videos with your credit!</li>
                                <li>• After that, it's super cheap - like $2 for 100 videos</li>
                                <li>• Way cheaper than any subscription service</li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AIVideoGenerator />);
    </script>
</body>
</html>
